<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Skill scores, first try to retry: answered first 2 to 4, structured story 3 to 4, evidence 2 to 4, ownership and learning 2 to 4; total 9 to 16"><rect width="900" height="420" rx="12" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="32" y="44" font-size="22" font-weight="700" fill="#1f2328">One real session: 9 → 16 out of 16</text><text x="32" y="70" font-size="15" fill="#59636e">Interview track, level L2, recorded on an Android phone. Each skill is scored 1 to 4 with a quoted line as evidence.</text><circle cx="40" cy="96" r="6" fill="#eb6834"/><text x="52" y="101" font-size="14" fill="#59636e">First try (vague, “we”, no numbers)</text><circle cx="330" cy="96" r="6" fill="#2a78d6"/><text x="342" y="101" font-size="14" fill="#59636e">Retry (owned it, gave the numbers)</text><line x1="230.0" y1="120" x2="230.0" y2="340" stroke="#d1d9e0" stroke-width="1"/><text x="230.0" y="360" font-size="13" fill="#59636e" text-anchor="middle">1</text><line x1="403.3333333333333" y1="120" x2="403.3333333333333" y2="340" stroke="#d1d9e0" stroke-width="1"/><text x="403.3333333333333" y="360" font-size="13" fill="#59636e" text-anchor="middle">2</text><line x1="576.6666666666666" y1="120" x2="576.6666666666666" y2="340" stroke="#d1d9e0" stroke-width="1"/><text x="576.6666666666666" y="360" font-size="13" fill="#59636e" text-anchor="middle">3</text><line x1="750.0" y1="120" x2="750.0" y2="340" stroke="#d1d9e0" stroke-width="1"/><text x="750.0" y="360" font-size="13" fill="#59636e" text-anchor="middle">4</text><text x="212" y="145" font-size="16" font-weight="500" fill="#1f2328" text-anchor="end">Answered first</text><line x1="403.3333333333333" y1="140" x2="750.0" y2="140" stroke="#d1d9e0" stroke-width="4" stroke-linecap="round"/><circle cx="403.3333333333333" cy="140" r="9" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="750.0" cy="140" r="9" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="145" font-size="15" font-weight="600" fill="#1f2328">2 → 4</text><text x="212" y="205" font-size="16" font-weight="500" fill="#1f2328" text-anchor="end">Structured story (STAR)</text><line x1="576.6666666666666" y1="200" x2="750.0" y2="200" stroke="#d1d9e0" stroke-width="4" stroke-linecap="round"/><circle cx="576.6666666666666" cy="200" r="9" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="750.0" cy="200" r="9" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="205" font-size="15" font-weight="600" fill="#1f2328">3 → 4</text><text x="212" y="265" font-size="16" font-weight="500" fill="#1f2328" text-anchor="end">Evidence</text><line x1="403.3333333333333" y1="260" x2="750.0" y2="260" stroke="#d1d9e0" stroke-width="4" stroke-linecap="round"/><circle cx="403.3333333333333" cy="260" r="9" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="750.0" cy="260" r="9" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="265" font-size="15" font-weight="600" fill="#1f2328">2 → 4</text><text x="212" y="325" font-size="16" font-weight="500" fill="#1f2328" text-anchor="end">Ownership &amp; learning</text><line x1="403.3333333333333" y1="320" x2="750.0" y2="320" stroke="#d1d9e0" stroke-width="4" stroke-linecap="round"/><circle cx="403.3333333333333" cy="320" r="9" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="750.0" cy="320" r="9" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="325" font-size="15" font-weight="600" fill="#1f2328">2 → 4</text><text x="32" y="406" font-size="14" fill="#59636e">The panel’s verdict moved too: won over 0 of 3 on the first try, 3 of 3 on the retry.</text></g></svg>