# Paywall copy, used by both paywalls. The app fills it in and passes headline, body and
# score_line to RevenueCat's remote paywall as custom variables (docs/REVENUECAT.md), so the two
# entry points get their own words and the mock paywall shows exactly the same text.
session_limit:
  headline: Keep practising "{{scenario_title}}"
  body: You've used your three free graded sessions. The next retry is usually where the new line sticks.
  score: "Your score on it so far: {{score_line}}."
# At the limit, starting a conversation you have not practised yet.
session_limit_new:
  headline: Practise "{{scenario_title}}" with Pro
  body: You've used your three free graded sessions. Pro keeps every conversation open, with as many retries as you need.
  score: ""
custom_scenario:
  headline: Rehearse the one you’re actually dreading
  body: Paste the real job posting, pitch or motion, and HardTalk builds the panel for it, with the questions they'll ask and the same scorecard.
  # A past score is not what this gate sells; the paywall shows a drafted panel instead.
  score: ""
# Shown the moment the purchase (or a restore from the paywall) lands.
unlocked: "Pro is on: unlimited grading, your own scenarios and your progress history."
features:
  - Unlimited graded sessions and retries
  - A panel built from your real job posting, pitch or motion
  - Progress history across every attempt
# Practice comes in bursts ("my interview is Friday"), so the week plan is for one real
# conversation coming up; annual is for people who keep practising.
plans:
  - { id: annual, label: Annual, price: "$29.99 a year", short: "$29.99/yr", note: Save 50% }
  - { id: weekly, label: One-week pass, price: "$2.99 a week", short: "$2.99/wk", note: "For one conversation coming up. Renews weekly until you cancel" }
  - { id: monthly, label: Monthly, price: "$4.99 a month", short: "$4.99/mo" }
