# Safety settings, read by the app and the server. See SAFETY.md for how each is used.

disclaimer: HardTalk is a practice tool. It is not therapy, and it is not HR or legal advice.

# Stopping. A clause that is only a request to stop ("stop", "can we stop here please", "Sam,
# stop") ends the practice at once, whatever else the line says. "pause" is also how people push
# back ("Can we pause, and look at the sprint?"), so a pause clause only counts when everything
# around it is a lead-in or a short trailer. "you" is never filler: "Can I stop you there?" is
# roleplay.
stop_words: [stop, pause]
# A clause that is only this word plus filler always stops, and so does a sentence that opens
# with it ("stop im scared", "Stop right now."), unless the next word makes it a verb ("stop
# blocking the release") or "you" ("stop you there").
stop_always: stop
# Words that may follow an opening "stop" and still make the sentence a stop request.
stop_openers: (right )?(now|there|here|please|talking|immediately|already|seriously|it|this|that|thank you|i mean it|the (simulation|practice|roleplay|conversation|session|call))|(i'?m|im|i|you'?re|please)\b.*
stop_filler: [please, pls, plz, now, here, there, ok, okay, no, just, wait, sorry, actually, hey,
  can, could, we, lets, i, want, need, to, the, id, like, for, a, bit, moment, second, minute,
  thanks, roleplay, role, play, practice, conversation, session, yes, yeah, um, so]
stop_objects: [it, this, that]
pause_lead_ins: [no, hold, on, hang, wait, enough, sorry, ok, okay, look, please, hey, right,
  alright, stop, pause, just, actually]
pause_trailers:
  - please
  - thanks
  - thank you
  - i mean it
  - now
  - sorry
  - i can'?t (do this|take this|breathe|cope)( anymore)?
  - i feel (sick|awful|terrible|unwell|faint|dizzy)
  - this is too much( for me)?
  - i need a (break|minute|moment|second)
  - i'?m not (okay|ok|alright|well)
  - i'?m (scared|afraid|done|frightened)
  - you'?re scaring me
  - i can'?t (do|take) (this|it)( anymore)?

# Distress detection. Missing a real disclosure is the error to avoid; pausing the practice for
# an idiom is the error accepted. See SAFETY.md for why it is built this way.
#
# Tier 1: explicit disclosures, checked sentence by sentence. Always distress. This list only
# grows. An exception here may only be a complete harmless phrase ("cut myself some slack",
# "beat me to it"), never a test of the next word alone.
distress_explicit:
  - \b(kill|killed|hang|hanged|hanging|drown|drowned|poison|poisoned|off|unalive) myself\b
  - \bunalive\b
  - \bkms\b
  - \bshoot myself\b(?! in the foot)
  - \bharm(ed|ing)? myself\b
  - \b(think|thinking|thought|thoughts|dream|dreaming|planning|plan|going|want|wanted|trying|tried|feel like|considering|consider|imagining|imagine)( about| of| on| to)? (killing|hurting|harming|cutting|hanging|ending|kill|hurt|harm|cut|hang|end) (myself|my life)\b(?! (some slack|a break|off from))
  - \b(keep|keeps|kept|been|started|start) (hurting|harming|cutting|hanging) myself\b(?! (some slack|a break|off from))
  - \bcut(ting)? my wrists?\b
  - \bslit my wrists?\b
  - \bself[- ]?harm
  - \bsuicid(e|al)\b(?! (mission|squad)\b)
  - \b(end|ending|take|taking) (my|my own) life\b
  - \b(end|ending) it all\b
  - \bwant(ed)? to die\b(?! of (embarrassment|shame|boredom|laughing))
  - \bwish i (could|would) die\b
  - \bwant to be dead\b
  - \b(rather|better off) be(ing)? dead\b
  - \bwish (i was|i were|i'd) (dead|never born)\b
  - \bbetter off (dead|without me)\b
  - \bdon't want to (be alive|live|exist|be here|wake up)\b
  - \b(no reason|nothing) to live\b
  - \bpoint (in|of) (living|life|being alive|going on)\b(?! with the (review|meeting|project|sprint|plan|release|call))
  - \bfeel like dying\b
  - \b(nobody|no one|no-one) would (care|notice|miss me) if i (disappeared|was gone|were gone|died|wasn't here)\b
  - \bwant to (disappear forever|not wake up|stop existing)\b
  - \b(want|going|planning|plan) to end (it|things)( tonight| today| this weekend| soon| now)?(?=\s*(,|$))
  - \b(thinking|thought|think) (of|about) ending (it|things)(?=\s*(,|$))
  - \b(i've got|i have|i've saved|i've been saving|i bought|i've bought) (the|my|some|enough) pills\b
  - \b(nobody|no one|no-one) (will|would) (miss me|care if i'?m (gone|dead))\b
  - \b(take|taking|took|taken|swallow|swallowing|swallowed) (all )?(of )?(my|the|these|those|a bunch of|a lot of|too many|a handful of) pills\b
  - \boverdos(e|ed|ing)\b
  - \b(jump|jumping|step|stepping|walk|walking|throw myself|throwing myself) (off|from|in front of|under) (the|a) (roof|bridge|building|balcony|window|train|bus|car|truck|lorry|platform|cliff)\b
  - \bpanic attacks?\b
  - \bi can't breathe\b
  - \b(rape|raped|raping|rapist|molest|molested|molesting|groped|groping)\b
  - \bsexual(ly)? (assault|assaulted|assaulting|harass|harassed|harassing|harassment|abuse|abused)\b(?! (training|policy|course|module|workshop|video|complaint process))
  - \b(sleep|have sex) with (him|her|them|me)\b
  - \b(attacked|punched|slapped|choked|strangled|assaulted|beaten|kicked|shoved|pinned|abused) me\b
  - \b(punch|punches|punching|slap|slaps|slapping|kick|kicks|kicking|choke|chokes|choking|strangle|strangles|strangling|attack|attacks|attacking|abuse|abuses|abusing) me\b
  - \b(said|says|told me|swore) (he|she|they)('d| would| will|'ll)( [a-z]+)? (kill|hurt|rape|beat|hit) me\b
  - \b(he's|she's|they're|he is|she is|they are) (going to|gonna) (kill|hurt|rape|beat) me\b
  - \b(beat|beats|beating) me\b(?! (to it|to the punch))
  - \bthreaten(ed|s|ing)? to (kill|hurt|hit|rape|beat) me\b
  - \b(you're|you are) scaring me\b
  - \b(i was|i've been|i got|i keep getting|i keep being|i'm being|i am being) (attacked|assaulted|punched|slapped|groped|beaten|choked|abused|harassed|kicked|shoved)\b
  - \b(got|was|been|keep getting|i'm being|am being) (hit|punched|slapped|kicked|beaten|pushed|grabbed|groped|touched|shoved|choked|attacked) by (my|him|her|them|someone|a (man|woman|guy|colleague|coworker|customer|client))\b
  - \b(slapped|punched|hit|kicked|grabbed|choked|twisted|squeezed|pulled) my (face|neck|arm|wrist|throat|head|body|hair|chest|leg|hand)\b

# Tier 2: words that are usually harm but also appear in workplace idioms. Distress unless the
# WHOLE line, lowercased and without punctuation, is exactly one of the idiom templates below.
# Nothing can hide behind an idiom: one extra clause or sentence and the line is checked.
distress_ambiguous:
  - \b(hurt|hurting|cut|cutting|killing) myself\b
  - \b(hit|hits|hitting|hurt|hurts|hurting|pushed|pushes) me\b
  - \b(grabbed|grabs|grabbing|touched|touches|touching) me\b
  - \b(i was|i've been|i got|i keep getting|i keep being|i'm being|i am being) (hit|pushed|grabbed|hurt|touched)\b

