# Safety settings, read by the app and the server. See SAFETY.md for how each is used.

disclaimer: HardTalk is a practice tool. It is not therapy, and it is not HR or legal advice.

# A user line made only of one of these (plus "please", "now", "here"...) ends the roleplay at
# once, unscored. "Stop blocking the release" is roleplay and does not match.
stop_words: [stop, pause]

# Strong signals of real distress. Self-harm phrases match by default; only known workplace
# idioms are carved out ("I'm only hurting myself", "cut myself some slack", "killing myself to
# hit the deadline", "hit me up"). Missing a disclosure is worse than an unneeded pause, so when
# in doubt a pattern stays broad. src/safety/__tests__/rules.test.ts lists both kinds of line.
distress_patterns:
  - \bkill(ing)? myself\b(?! (to|for|over|at|with|working|trying|on))
  - (?<!(only|just|be|'d be|would be) )\b(hurt|harm)(ing)? myself\b(?! ((and|or) (the|my|our|everyone)\b|professionally|financially|more than|by (taking|saying|agreeing|doing|staying)))
  - \bcut(ting)? myself\b(?! (some|a) (slack|break))
  - \b(thought|thinking|think|thoughts) (about|of) (killing|hurting|harming|cutting|ending) (myself|my life)\b
  - \bself[- ]harm
  - \bsuicid(e|al)\b
  - \bend(ing)? (my|my own) life\b
  - \bend it all\b
  - \bwant to die\b(?! (of|laughing))
  - \bdon'?t want to (be alive|live|exist)( anymore)?\b
  - \b(no reason|nothing) to live\b
  - \bbetter off dead\b
  - \bhaving a panic attack\b
  - \bi can'?t breathe\b
  - \b(punched|slapped|kicked|shoved|choked|assaulted) me\b
  - \b(hit|hits) me\b(?! (up|with|that|last|when|how|what|like|as|hard|on (slack|teams|email|chat)))
  - \b(grabbed|grabs|groped) me\b
  - (?<!(really|deeply|truly|it|that|this|which) )\btouched me\b
  - \bsexually harass(ed|ing|es)? me\b

resources:
  - name: Emergency services
    detail: If you or someone else is in immediate danger, call your local emergency number now.
  - name: Find a Helpline
    detail: Free, confidential helplines in more than 130 countries.
    url: https://findahelpline.com
  - name: 988 Suicide & Crisis Lifeline (US)
    detail: Call or text 988, any time.
    url: https://988lifeline.org
  - name: Samaritans (UK and Ireland)
    detail: Call 116 123, free, any time.
    url: https://www.samaritans.org
  - name: Tele-MANAS (India)
    detail: Call 14416, free, any time.
    url: https://telemanas.mohfw.gov.in
