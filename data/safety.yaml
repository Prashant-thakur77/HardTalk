# Safety settings, read by the app and the server. See SAFETY.md for how each is used.

disclaimer: HardTalk is a practice tool. It is not therapy, and it is not HR or legal advice.

# A user line made only of one of these (plus "please", "now", "here"...) ends the roleplay at
# once, unscored. "Stop blocking the release" is roleplay and does not match.
stop_words: [stop, pause]

# Strong signals of real distress. Each pattern is unconditional: it matches whatever comes
# before or after it. Missing a real disclosure is worse than pausing for an idiom.
distress_patterns:
  - \bkill(ing)? myself\b
  - \b(hurt|hurting|harm|harming|cut|cutting) myself\b
  - \bself[- ]harm
  - \bsuicid(e|al)\b
  - \b(end|ending) (my|my own) life\b
  - \b(end|ending) it all\b
  - \btake my (own )?life\b
  - \bwant to die\b
  - \bdon'?t want to (be alive|live|exist)\b
  - \b(no reason|nothing) to live\b
  - \bbetter off dead\b
  - \bhaving a panic attack\b
  - \bi can'?t breathe\b
  - \b(hit|hits|hitting|punched|slapped|kicked|shoved|choked|beat|assaulted) me\b
  - \b(grabbed|grabs|groped|touched|touches) me\b
  - \bsexually harass(ed|ing|es)? me\b

# Whole workplace idioms that contain those words. Each is removed from the line before the
# patterns above are checked, so an exception can only ever cancel its own exact phrase:
# "cut myself some slack" is ignored, "cut myself" anywhere else is not.
idiom_exceptions:
  - \b(i'?m|i am) (only|just) hurting myself(?=\s*([.!?,]|$|if\b))
  - \b(i'?d|i would|would|i'?ll|i will)( only| just)? be (only |just )?hurting myself(?=\s*([.!?,]|$|if\b))
  - \bbe hurting myself and (the|my|our) (team|career|chances|project|delivery|reputation)
  - \bkilling myself (to (hit|meet|ship|get|finish|make|keep)|here\b|over (this|the) (release|deadline|project|sprint|pr)\b|working)
  - \bcut(ting)? myself (some slack|a break|off from)
  - \bhit me (up|back)\b
  - \bhit me with (a |an |the |another |this |that |some |more )*(new |last-minute )?(requirement|request|question|deadline|change|task|ticket|bug|email|message|ask|feature|surprise|curveball)s?\b
  - \b(it|that|this|reality)( really| just| finally| suddenly)? hit me (that|last|when|how|then|yesterday|this morning|today|hard|too)\b
  - \b(the )?(news|layoffs|reorg|feedback)( really| just)? hit me\b
  - \bwhat (really )?hit me (was|is)\b
  - \b(what|that|this|the idea|the proposal|the timeline)( really)? grabbed me\b
  - \b(that|this|what you said|your (message|note|words|email|feedback|kindness))( really| truly| deeply| genuinely)? touched me\b
  - \b(really|truly|deeply|genuinely) touched me\b
  - \bwant to die of (embarrassment|shame|boredom)\b

resources:
  - name: Emergency services
    detail: If you or someone else is in immediate danger, call your local emergency number now.
  - name: Find a Helpline
    detail: Free, confidential helplines in more than 130 countries.
    url: https://findahelpline.com
  - name: 988 Suicide & Crisis Lifeline (US)
    detail: Call or text 988, any time.
    url: https://988lifeline.org
  - name: Samaritans (UK and Ireland)
    detail: Call 116 123, free, any time.
    url: https://www.samaritans.org
  - name: Tele-MANAS (India)
    detail: Call 14416, free, any time.
    url: https://telemanas.mohfw.gov.in
