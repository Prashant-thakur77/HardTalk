# Safety settings, read by the app and the server. See SAFETY.md for how each is used.

disclaimer: HardTalk is a practice tool. It is not therapy, and it is not HR or legal advice.

# A user line made only of one of these (plus "please", "now", "here"...) ends the roleplay at
# once, unscored. "Stop blocking the release" is roleplay and does not match.
stop_words: [stop, pause]

# Distress detection runs on each sentence, after normalising spelling ("wanna", "my self",
# "dont", "cannot", extra spaces). See SAFETY.md for why it is built this way. Missing a real
# disclosure is the error to avoid; pausing the practice for an idiom is the error accepted.
#
# Tier 1: explicit disclosures. Always distress. This list only ever grows: a false alarm is
# answered with a test marking it accepted, never by narrowing a pattern. The only carve-outs
# are exact continuations that make a common phrase ("shoot myself in the foot").
distress_explicit:
  - \b(kill|killed|hang|hanged|hanging|drown|drowned|poison|poisoned) myself\b
  - \bshoot myself\b(?! in the foot)
  - \bharm(ed|ing)? myself\b
  - \b(think|thinking|thought|thoughts|dream|dreaming|planning|plan|going|want|wanted|trying|tried)( about| of| on| to)? (killing|hurting|harming|cutting|hanging|ending|kill|hurt|harm|cut|hang|end) (myself|my life)\b(?! (some slack|a break|off from))
  - \b(keep|keeps|kept|been|started|start) (hurting|harming|cutting|hanging) myself\b(?! (some slack|a break|off from))
  - \bself[- ]?harm
  - \bsuicid(e|al)\b(?! (mission|squad|run))
  - \b(end|ending|take|taking) (my|my own) life\b
  - \b(end|ending) it all\b
  - \bwant to die\b(?! of (embarrassment|shame|boredom|laughing))
  - \bwant to be dead\b
  - \bwish (i was|i were|i'd) (dead|never born)\b
  - \bbetter off (dead|without me)\b
  - \bdon't want to (be alive|live|exist|be here)\b
  - \b(no reason|nothing) to live\b
  - \bpoint (in|of) (living|life|being alive|going on)\b(?! with the (review|meeting|project|sprint|plan|release|call))
  - \bfeel like dying\b
  - \bwant to (disappear forever|not wake up|stop existing)\b
  - \b(want|going|planning|plan) to end (it|things)$
  - \b(thinking|thought|think) (of|about) ending (it|things)$
  - \b(take|taking|swallow|swallowing) (all )?(my|the|these|those) pills\b
  - \boverdos(e|ed|ing)\b
  - \bslit my wrists?\b
  - \bjump (off|from|in front of) (the|a) (roof|bridge|building|balcony|window|train|bus|car)\b
  - \bpanic attacks?\b
  - \bi can't breathe\b
  - \b(rape|raped|raping|rapist|molest|molested|molesting|groped|groping)\b
  - \bsexual(ly)? (assault|assaulted|assaulting|harass|harassed|harassing|harassment|abuse|abused)\b(?! (training|policy|course|module|workshop|video|complaint process))
  - \b(attacked|punched|slapped|choked|strangled|assaulted|beaten) me\b
  - \b(beat|beats|beating) me\b(?! (to it|to the punch|by|at|why|how|what))
  - \bkicked me\b(?! (off|out))
  - \bshoved me\b(?! (onto|on to|into) (the |another |a )?(rota|on-call|schedule|project|team|meeting))
  - \b(i was|i've been|i got|i keep getting|i keep being|i'm being|i am being) (attacked|assaulted|punched|slapped|groped|beaten|hit|kicked|pushed|shoved|choked|grabbed|hurt|abused|harassed)\b
  - \b(got|was|been|keep getting|i'm being|am being) (hit|punched|slapped|kicked|beaten|pushed|grabbed|groped|touched|shoved|choked|attacked) by (my|him|her|them|someone|a (man|woman|guy|colleague|coworker|customer|client))\b
  - \b(slapped|punched|hit|kicked|grabbed|choked|twisted|squeezed) my (face|neck|arm|wrist|throat|head|body|hair|chest|leg)\b

# Tier 2: words that are usually harm but also appear in workplace idioms. Distress unless
# that exact occurrence sits inside one of the idioms below.
distress_ambiguous:
  - \b(hurt|hurting|cut|cutting|killing) myself\b
  - \b(hit|hits|hitting|hurt|hurts|pushed|pushes) me\b
  - \b(grabbed|grabs|grabbing|touched|touches|touching) me\b

# Idioms. Two kinds, and nothing else:
#  - a request or remark that starts its clause, with no person before it: "Hit me back by EOD",
#    "Sam, hit me back", "It hit me that…". {{clause}} is that clause start.
#  - a phrase whose own subject or object is harmless: "the layoffs hit me", "hit me with a new
#    requirement", "killing myself to hit the deadline".
# The generated tests put a person in front of every idiom and require distress each time.
clause_start: (?:^|, )(?:(?:honestly|look|so|ok|okay|oh|well|just|please|go on|can you|could you|would you|if i take this on|if i say yes to this too)[, ]+)?
idioms:
  - "{{clause}}hit me (up|back)\\b(?! (against|into|on the|in the))"
  - "{{clause}}hit me on (slack|teams|email|chat)\\b"
  - "{{clause}}hit me with (it|your feedback|your questions|the details|the numbers)$"
  - "\\bhit me with (a new requirement|another requirement|a new request|a new deadline|more scope)\\b"
  - "{{clause}}it (really |finally |suddenly |just )?hit me (last night |this morning |yesterday |then )?(that|when you)\\b"
  - "{{clause}}(that|this) (really |just )?hit me hard$"
  - "\\b(the news|that news|the layoffs|the reorg|the feedback|your comment|that comment|the deadline change) (really |just )?hit me\\b"
  - "\\bkilling myself (to|trying to) (hit|meet|ship|make|get|finish|deliver) (this|that|the|our) (deadline|date|release|sprint|feature|work|project)( out)?\\b"
  - "\\bkilling myself trying to hit friday\\b"
  - "\\bkilling myself (for this team|on the migration|on this migration|on the project|on this release|on the billing work)\\b"
  - "\\bkilling myself with (overtime|work|meetings)\\b"
  - "{{clause}}i'm (already |literally |honestly )?killing myself here$"
  - "{{clause}}i'm (only|just) hurting myself$"
  - "{{clause}}i'd (only |just )?be (only |just )?hurting myself$"
  - "\\bbe hurting myself and (the|my|our) team('s delivery)?\\b"
  - "\\bwould hurt myself and (the|my|our) team\\b"
  - "\\bcut(ting)? myself (some slack|a break|off from (the|slack|email|work))\\b"
  - "{{clause}}it (really |truly |deeply )?touched me that\\b"
  - "{{clause}}(that|this) (really|truly|deeply) touched me$"
  - "\\b(your message|your note|your words|your email|your kindness|what you said)( in the (retro|meeting|standup))?( really| truly| deeply)? touched me\\b"
  - "\\b(what|that idea|the idea)( really)? grabbed me about\\b"
  - "{{clause}}(that|the) idea (really )?grabbed me$"
  - "{{clause}}(that|this|it) (really |honestly )?hurt me$"
  - "\\b(that comment|your comment|your words|your feedback|that feedback|that deadline|the decision|the news)( really| honestly)? hurt me\\b"
  - "\\bpushed me (to take|into taking|to say|into saying|to agree|into agreeing|to accept|to finish|to ship)\\b"

resources:
  - name: Emergency services
    detail: If you or someone else is in immediate danger, call your local emergency number now.
  - name: Find a Helpline
    detail: Free, confidential helplines in more than 130 countries.
    url: https://findahelpline.com
  - name: 988 Suicide & Crisis Lifeline (US)
    detail: Call or text 988, any time.
    url: https://988lifeline.org
  - name: Samaritans (UK and Ireland)
    detail: Call 116 123, free, any time.
    url: https://www.samaritans.org
  - name: Tele-MANAS (India)
    detail: Call 14416, free, any time.
    url: https://telemanas.mohfw.gov.in
