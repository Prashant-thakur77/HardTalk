# Recorded conversations replayed in mock mode. Attempt 1 is a typical first try;
# attempt 2 is the retry. Every evidence quote is a verbatim substring of a user turn.
scenario_id: pitch-seed-round
attempts:
  - end_reason: stop_condition
    turns:
      - { speaker: persona, text: "Thanks for the pitch. Let's go straight to questions. Who actually pays for this?" }
      - { speaker: user, text: "So, um, that's a great question. There are a lot of ways we could go with monetisation, like premium features, maybe partnerships with universities, and we've thought about ads too, but we don't want to ruin the experience." }
      - { speaker: persona, text: "So today, nobody pays?" }
      - { speaker: user, text: "Not yet, no. But students really love it, we get tons of messages saying it helped them study." }
      - { speaker: persona, name: Kenji, text: "How does the matching actually work? And what stops a university building the same thing?" }
