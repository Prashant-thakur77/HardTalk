      - { speaker: persona, name: Leo, text: "The usage is genuinely interesting. But you both graduate in May. Are you going full-time on this?" }
      - { speaker: user, text: "Yeah, I mean, we're really passionate about it, so we'll definitely figure something out." }
      - { speaker: persona, text: "My worry is retention. What happens to your users when they graduate?" }
      - { speaker: user, text: "I think that's true for every student app, honestly. New students come in every year, so it kind of balances out." }
      - { speaker: persona, text: "Okay. Thanks for coming in. We'll be in touch." }
      - { speaker: user, text: "Great, thanks so much, let us know if you have any other questions!" }
