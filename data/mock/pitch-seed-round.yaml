      safety_flag: false

  - end_reason: stop_condition
    turns:
      - { speaker: persona, text: "Thanks for the pitch. Let's go straight to questions. Who actually pays for this?" }
      - { speaker: user, text: "Today, one campus club pays us $300 a semester for a group plan. Next is a $4 a month premium tier, which we launch in January." }
      - { speaker: persona, text: "One club isn't a business. Why would a student pay four dollars?" }
      - { speaker: user, text: "Fair, one club proves the price, not the market. In a survey of 410 active users, 22% said they'd pay $4 a month for exam-week matching, and that's the premium feature." }
      - { speaker: persona, name: Kenji, text: "Walk me through the matching. What stops a university or a big platform building the same thing?" }
      - { speaker: user, text: "Matching uses course, free hours in each student's timetable, and exam date. A university could copy the form, but not fourteen months of data on which groups keep meeting. Does that answer the copying question?" }
      - { speaker: persona, name: Leo, text: "It answers mine. But you both graduate in May. Are you going full-time?" }
      - { speaker: user, text: "Yes. We both go full-time on June 1st, and this round pays us both for eighteen months." }
      - { speaker: persona, text: "Students graduate and leave. What happens to your users then?" }
      - { speaker: user, text: "That's a fair worry. 38% of students who join are still active eight weeks later, and every fall a new first-year class arrives, which is when our sign-ups peak. So we measure retention per semester, not per student." }
      - { speaker: persona, text: "Per semester. I'd want to see that cohort data." }
      - { speaker: user, text: "I'll send the cohort data tonight. Can we book a partner meeting next Tuesday at 10 to walk through it?" }
      - { speaker: persona, text: "Send it tonight. If it holds up, Tuesday at 10 works." }
