        evidence:
          score: 2
          evidence_quotes: ["But students really love it, we get tons of messages saying it helped them study."]
          rationale: "\"Tons of messages\" is support nobody can check. You had real numbers and didn't use one."
          better_line: "38% of students who join are still active eight weeks later."
        objection_handling:
          score: 1
          evidence_quotes:
            - "universities are way too slow to build anything like this"
            - "New students come in every year, so it kind of balances out."
          rationale: "You waved off both worries. Kenji's copying question got \"too slow\" and Maya's retention question got \"kind of balances out\", with no fact behind either."
          better_line: "A university could copy the form, but not fourteen months of data on which groups keep meeting."
        next_step:
          score: 1
          evidence_quotes: ["let us know if you have any other questions!"]
          rationale: "You left the next step to Maya, so the meeting ended with nothing booked."
          better_line: "Can we book a partner meeting next Tuesday to go through the retention data?"
