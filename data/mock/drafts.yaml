# Recorded drafts for mock mode: one sample text per track, and the scenario the live drafter
# would return for it. Mock mode offers the sample and returns this draft; live mode drafts
# whatever the user pastes. Each draft follows data/prompts/drafter.yaml.
samples:
  - track: workplace
    label: An unfair weekend on-call rota
    source: |
      I'm a backend developer on the payments team at Larkspur Logistics, a delivery software
      company with about 300 staff. Six engineers share the weekend on-call rota for the
      payments service. Over the last three months I've been on call for seven of the twelve
      weekends. If it rotated evenly, it would have been two.

      My team lead builds the rota each month. When I asked about it in chat, he said I'm
      "the one who knows the settlement system best". That's true, because I wrote most of it
      last year. But two of the other engineers have never covered a weekend on settlement,
      and there is no runbook for it.

      Last month I missed my sister's graduation because of a Saturday incident. I don't want
      to refuse on-call altogether. I want a fair share. I'm happy to write a settlement
      runbook and run two training sessions so the others can cover it.

      We're meeting on Thursday about the November rota. My team lead has asked our
      engineering manager and one of the other engineers to join, since it affects the whole
      team. I want to leave with the November weekends split evenly.
    draft:
      title: Ask for a fair share of weekend on-call
      summary: >-
        You've been on call for seven of the last twelve weekends, and the rota is meant to
        rotate across six engineers. Ask for an even split in November, and show how the
        settlement system will still be covered.
      user_goal: Leave with the November weekends split evenly across the six engineers.
      persona:
        name: Hugo
        face: { skin: light, hair: brown, hair_style: short, top: charcoal, glasses: false, beard: true, earrings: false }
        role: Your team lead, who builds the monthly on-call rota
        goal: Keep the payments service covered at weekends with as little risk as possible.
        hidden_objection: >-
          Hugo fears that if a settlement incident lands on a weekend when someone new is on
          call, he will be the one answering for it, so keeping the user on the rota feels
          like the safe choice for him.
        tone: Friendly, practical, a little defensive about the rota.
        context:
          - The user is a backend developer on the payments team at Larkspur Logistics, a
            delivery software company with about 300 staff.
          - Six engineers share the weekend on-call rota for the payments service. The user
            has been on call for seven of the last twelve weekends; an even rotation would
            have been two.
          - The user wrote most of the settlement system last year. Two of the other engineers
            have never covered a weekend on settlement, and there is no runbook for it.
          - The user missed their sister's graduation last month because of a Saturday
            incident.
          - The user has offered to write a settlement runbook and run two training sessions
            so others can cover it.
          - This meeting is about the November rota.
        asks_about: [How weekends have been assigned, What you are asking for]
        cares_about: [ask_made, boundary_held]
      panel:
        - name: Talia
          face: { skin: tan, hair: black, hair_style: long, top: teal, glasses: false, beard: false, earrings: true }
          role: Engineer on the payments team who has never covered settlement
          stance: agrees
          view: >-
            Thinks the rota has been lopsided and says so. Wants to learn the settlement
            system and asks when the training sessions would happen and what the runbook
            would cover. Offers to take a November weekend if the training comes first.
          tone: Warm, direct, keen to help.
          asks_about: [The training plan, When others could start]
          cares_about: [empathy]
        - name: Owen
          face: { skin: porcelain, hair: auburn, hair_style: crop, top: blue, glasses: true, beard: false, earrings: false }
          role: Engineering manager for the payments team
          stance: questions
          view: >-
            Supports fairness in principle but keeps asking how settlement stays covered in
            November if the rota changes. Wants a date for the runbook and a clear answer on
            who handles a settlement problem while the others are still learning.
          tone: Calm, careful, keeps pressing for specifics.
          asks_about: [Covering settlement in November, A date for the runbook]
          cares_about: [clarity]
      difficulty_levels:
        L1:
          name: Open
          summary: Listens, and agrees to a fair split once you make it concrete.
          behaviour: >-
            Admits the rota has been uneven when the user gives the seven-of-twelve number.
            Agrees to an even November split once the user offers the runbook with a date.
          mood: friendly
        L2:
          name: Reluctant
          summary: Praises your expertise and asks you to carry on for one more month.
          behaviour: >-
            Leans on the user's knowledge of settlement and asks them to keep the weekends
            for one more month. Agrees to an even split only after the user restates the ask
            and names who would cover which weekend.
          mood: skeptical
        L3:
          name: Guarded
          summary: Treats the ask as a lack of team spirit and brings up the risk.
          behaviour: >-
            Suggests the user is not being a team player and says settlement is too risky to
            hand over. Agrees only to a dated plan: runbook first, training second, and an
            even split from a named weekend.
          mood: stern
      opening_line: Thanks for setting this up. You said in chat you wanted to talk about the rota?
      stop_condition: >-
        End when the user has asked for a specific change to the November rota and Hugo has
        agreed to it, declined it, or set a condition on it, and both Talia and Owen have
        asked their questions.

  - track: pitch
    label: A student startup's accelerator pitch
    source: |
      Pantry Loop lets students buy surplus meals from campus dining halls at a discount in
      the last hour before the hall closes. Students reserve a meal in the app and collect it
      at the counter.

      We launched at two campuses nine months ago. Since then 1,900 students have signed up,
      640 use the app in a typical week, and we have sold 4,200 meals. The average meal costs
      the student $3.50. The dining hall keeps 70% and we keep 30%.

      Our supply comes from the catering service at each campus. Both agreements renew at the
      start of each term, and both catering managers renewed in September. At the first
      campus, the catering manager says food waste in the last hour has dropped by about a
      third.

      We are two final-year students: one studies computer science and built the app, the
      other studies business and signs up the dining halls. We graduate in June.

      We are applying to the Northgate Launch Fund for $150,000 in pre-seed funding. It covers
      twelve months, in which we plan to reach eight campuses and build a dashboard that
      shows dining halls what they sold and what they saved.
    draft:
      title: Win a place at the Northgate Launch Fund
      summary: >-
        You've just pitched Pantry Loop, your surplus-meal app, to the Northgate Launch Fund.
        Three people have questions; answer them and leave with a next step.
      user_goal: Leave with a clear next step from the fund, such as a second meeting with a date.
      persona:
        name: Marta
        face: { skin: olive, hair: dark_brown, hair_style: bun, top: purple, glasses: true, beard: false, earrings: true }
        role: Partner at the Northgate Launch Fund
        goal: Decide whether Pantry Loop can grow from two campuses to eight in twelve months.
        hidden_objection: >-
          Marta worries that the whole business rests on a few catering managers who can walk
          away at any term renewal, and that one bad term could empty the app overnight.
        tone: Polite, brisk, wants numbers.
        context:
          - Pantry Loop lets students buy surplus meals from campus dining halls at a discount
            in the last hour before the hall closes. Students reserve in the app and collect
            at the counter.
          - It launched at two campuses nine months ago. 1,900 students have signed up, 640
            use it in a typical week, and 4,200 meals have been sold.
          - The average meal costs $3.50. The dining hall keeps 70% and Pantry Loop keeps 30%.
          - Supply comes from the catering service at each campus. Both agreements renew each
            term, and both renewed in September. At the first campus, last-hour food waste
            has dropped by about a third, according to the catering manager.
          - The founders are two final-year students, one in computer science and one in
            business. They graduate in June.
          - They are asking the fund for $150,000 in pre-seed funding for twelve months, to
            reach eight campuses and build a dashboard for dining halls.
        asks_about: [How you make money, Why dining halls say yes]
        cares_about: [evidence, objection_handling]
      panel:
        - name: Idris
          face: { skin: deep, hair: black, hair_style: short, top: green, glasses: false, beard: true, earrings: false }
          role: Mentor at the fund and former student founder
          stance: agrees
          view: >-
            Likes that the app is live on two campuses with real weekly use, and says so. His
            main question is what the two founders will do after they graduate in June. A
            clear plan with a date wins him over; a vague answer makes him go quiet.
          tone: Warm, informal, speaks from experience.
          asks_about: [The founding team, Plans after June]
          cares_about: [answer_directness]
        - name: Selma
          face: { skin: light, hair: blonde, hair_style: bob, top: red, glasses: false, beard: false, earrings: true }
          role: Finance lead at the fund
          stance: questions
          view: >-
            Works out that 30% of a $3.50 meal is about a dollar, and asks how $150,000 turns
            into eight campuses at that margin. Wants to know what each new campus costs to
            launch and how many meals a week it needs to pay its way.
          tone: Quiet, exact, one number at a time.
          asks_about: [Revenue per meal, Cost of each new campus]
          cares_about: [next_step]
      difficulty_levels:
        L1:
          name: Curious
          summary: Interested, and asks fair questions once each.
          behaviour: >-
            Asks each question once and accepts a clear answer with one number behind it.
            Agrees to a second meeting as soon as the user asks for one directly.
          mood: friendly
        L2:
          name: Skeptical
          summary: Wants a number behind every claim and questions the supply side.
          behaviour: >-
            Asks for a number behind every claim and pushes back once on how the dining halls
            are kept on board. Agrees to a next step only after a specific ask with a date.
          mood: skeptical
        L3:
          name: Unconvinced
          summary: Cuts long answers short and calls it a campus side project.
          behaviour: >-
            Interrupts long answers, calls Pantry Loop a side project, and doubts eight
            campuses in a year. Agrees to a next step only if the user answers the supply
            question with the September renewals and the waste figure, then asks for a dated
            meeting.
          mood: stern
      opening_line: Thanks for the pitch. First question, who pays you, and how much of each meal do you keep?
      stop_condition: >-
        End when the user has asked for a specific next step and Marta has agreed to it,
        declined it, or set a condition on it, and both Idris and Selma have asked their
        questions.

  - track: interview
    label: A graduate engineering job posting
    source: |
      Junior Software Engineer (Graduate), Harbourline Health

      Harbourline Health is a 400-person company that builds appointment booking and patient
      reminder software for clinics. More than 900 clinics use our tools, and patients book
      around 60,000 appointments through them every day.

      You will join the Bookings team: five engineers, a product manager and a designer.

      What you'll do:
      - Build and ship features in TypeScript and Python, with support from a senior engineer
        as your mentor.
      - Write automated tests for the code you ship, and review your teammates' code.
      - Work with clinic staff to understand how bookings go wrong in real life.

      What we're looking for:
      - A degree in computer science or a related subject, or equivalent experience.
      - At least one project you built and can talk about in depth, including the part you
        wrote yourself.
      - Working knowledge of SQL.
      - Comfort writing automated tests.
      - Nice to have: experience with accessibility or cloud services.

      How we work: we put patients first, we write things down clearly, and we ask for help
      early. Graduates start in September and spend their first month pairing with their
      mentor.
    draft:
      title: Win the graduate engineer interview at Harbourline
      summary: >-
        Harbourline Health is hiring a graduate engineer for its Bookings team. Talk about a
        project you built and your part in it, how you learn, and how you test your code.
      user_goal: Show one real project, the part you built yourself, and how you would grow on this team.
      persona:
        name: Farah
        face: { skin: brown, hair: black, hair_style: long, top: teal, glasses: true, beard: false, earrings: true }
        role: Engineering manager of the Bookings team at Harbourline Health
        goal: Find out whether the candidate has built something real and works well with a team.
        hidden_objection: >-
          Farah's last graduate hire spent weeks stuck on a problem in silence before anyone
          noticed. She now listens closely for whether a candidate will speak up when they
          are lost, or keep quiet to look capable.
        tone: Direct, friendly, technical.
        context:
          - This is an interview for the Junior Software Engineer (Graduate) role on the
            Bookings team at Harbourline Health.
          - Harbourline Health has 400 people and builds appointment booking and patient
            reminder software. More than 900 clinics use it, and patients book around 60,000
            appointments a day through it.
          - The Bookings team is five engineers, a product manager and a designer. The work is
            in TypeScript and Python, and each graduate has a senior engineer as a mentor.
          - The posting asks for a project the candidate built and can discuss in depth,
            working knowledge of SQL, and comfort writing automated tests.
          - The company's stated values are putting patients first, writing things down
            clearly, and asking for help early.
        asks_about: [A project you built, Working in a team]
        cares_about: [star_structure, ownership]
      panel:
        - name: Jonas
          face: { skin: porcelain, hair: blonde, hair_style: crop, top: charcoal, glasses: false, beard: true, earrings: false }
          role: Senior engineer on the Bookings team, and the new graduate's mentor
          stance: agrees
          view: >-
            Wants the candidate to do well and says so when an answer is good. Asks how the
            candidate learned something new recently and how they would like to be mentored.
            A concrete example of learning something fast earns a short, encouraging comment.
          tone: Warm, patient, curious.
          asks_about: [How you learn new things, What you want from a mentor]
          cares_about: [answer_directness]
        - name: Lucia
          face: { skin: olive, hair: dark_brown, hair_style: ponytail, top: amber, glasses: false, beard: false, earrings: true }
          role: Staff engineer who leads testing across Harbourline
          stance: questions
          view: >-
            Probes the testing requirement in the posting. Asks what automated tests the
            candidate has written and what a test once caught, then how they would test a
            booking that crosses midnight. Keeps asking until she hears a specific example.
          tone: Polite, precise, keeps pressing.
          asks_about: [Tests you have written, Testing a tricky booking]
          cares_about: [evidence]
      difficulty_levels:
        L1:
          name: Warm
          summary: Friendly, and lets you tell your story your way.
          behaviour: >-
            Listens without interrupting and asks one gentle follow-up about which part the
            candidate wrote personally. Accepts a clear answer and moves on.
          mood: friendly
        L2:
          name: Probing
          summary: Asks who did what, and wants a result you can measure.
          behaviour: >-
            Asks "what did you write yourself?" whenever the candidate describes group work,
            and asks for a result if none is given. Asks once what the candidate did the last
            time they got stuck.
          mood: skeptical
        L3:
          name: Tough
          summary: Interrupts vague answers and gives nothing away.
          behaviour: >-
            Interrupts after two vague sentences, asks whether the project was only
            coursework, and never signals approval. Accepts only a real project with the
            candidate's own part named, a result, and an honest account of getting stuck.
          mood: stern
      opening_line: Hi, thanks for coming in. Tell us about a project you built, and how you worked with others on it.
      stop_condition: >-
        End when the user has described one real project with their own part and its result,
        and both Jonas and Lucia have asked their questions.

  - track: debate
    label: A debate society motion
    source: |
      Ashcombe University Debating Society, Wednesday open debate

      Motion: This House would ban unpaid internships.

      Format: one speaker for the motion and one against. Each opens with a short case, then
      the chair and the floor put questions to both speakers.

      Background for both sides, treated as given for this debate:
      - In a society survey of 210 members, 41% had done at least one unpaid internship.
      - Of those, 63% said they could only afford it because their family supported them.
      - The university careers service advertised 120 internships last year, and 35 of them
        were unpaid.
      - Most of the unpaid ones were at small charities, arts organisations and start-ups.

      The proposition will argue that unpaid internships shut out students who cannot work
      for free, so they should be banned. The opposition will argue that a ban would mean
      fewer opportunities, because small organisations cannot afford to pay.

      Speakers should be ready to say how a ban would work in practice, and what happens to
      organisations that cannot pay.
    draft:
      title: Argue for banning unpaid internships
      summary: >-
        Motion: This House would ban unpaid internships. You argue for it; Elena argues
        against, the chair wants evidence from both of you, and a member from the floor
        backs your side.
      user_goal: Make your claim clearly, answer Elena's strongest point, and hold your position.
      persona:
        name: Elena
        face: { skin: light, hair: auburn, hair_style: bob, top: blue, glasses: true, beard: false, earrings: false }
        role: Opposing speaker, arguing against the motion
        goal: Win the round by showing that a ban would leave students with fewer opportunities.
        hidden_objection: >-
          Elena privately thinks many unpaid placements are ordinary work dressed up as
          training, and fears her case falls apart once someone separates genuine training
          from unpaid labour.
        tone: Sharp, confident, quick to reframe.
        context:
          - 'The motion is "This House would ban unpaid internships". The user argues for it;
            Elena argues against.'
          - Facts both sides can use, treated as given. In a society survey of 210 members,
            41% had done at least one unpaid internship, and 63% of those could only afford
            it because their family supported them.
          - The careers service advertised 120 internships last year, and 35 were unpaid. Most
            of the unpaid ones were at small charities, arts organisations and start-ups.
          - Elena's main theme is that small organisations cannot afford to pay, so a ban
            means fewer opportunities.
        asks_about: [Fewer opportunities, Small charities and the arts]
        cares_about: [rebuttal, held_position]
      panel:
        - name: Beatrix
          face: { skin: deep, hair: grey, hair_style: afro, top: purple, glasses: true, beard: false, earrings: true }
          role: Chair of the debate
          stance: questions
          view: >-
            Neutral on the motion. Presses both speakers for evidence behind every claim and
            asks Elena for hers at least once. When the user sidesteps Elena's point, she
            names it and asks the user to answer it directly. Asks how a ban would be
            enforced.
          tone: Crisp, fair, keeps turns short.
          asks_about: [How a ban would work, Evidence for your claim]
          cares_about: [steelman]
        - name: Rohan
          face: { skin: brown, hair: black, hair_style: curly, top: green, glasses: false, beard: true, earrings: false }
          role: Society member speaking from the floor
          stance: agrees
          view: >-
            Supports the motion and says so. Asks the user to turn the 63% figure into a
            plain point about who gets shut out, and what should happen to the small
            organisations that cannot pay. Nods along to a clear, specific answer.
          tone: Friendly, earnest, brief.
          asks_about: [Who gets left out today, What small organisations do]
          cares_about: [claim_clarity]
      difficulty_levels:
        L1:
          name: Fair
          summary: Argues back politely and gives you room to answer.
          behaviour: >-
            Makes one counter-argument at a time and lets the user answer in full. Concedes a
            point when the user answers it with a figure from the survey.
          mood: friendly
        L2:
          name: Sharp
          summary: Reframes your points and asks for evidence each time.
          behaviour: >-
            Reframes the user's claims as harsh on small charities and asks for evidence
            behind each one. Concedes only after the user answers the fewer-opportunities
            point directly.
          mood: skeptical
        L3:
          name: Relentless
          summary: Interrupts, reframes, and gives no ground.
          behaviour: >-
            Interrupts long answers, repeats that a ban means fewer opportunities, and never
            concedes a point outright. Softens only if the user separates real training from
            ordinary work and backs it with the survey figures.
          mood: stern
      opening_line: Unpaid internships open doors that would otherwise stay shut. Ban them, and the door just closes. Tell me why I'm wrong.
      stop_condition: >-
        End when the user has made a clear claim, answered Elena's point about fewer
        opportunities, and both Beatrix and Rohan have asked their questions.
