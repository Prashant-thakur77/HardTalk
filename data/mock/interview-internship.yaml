  - end_reason: stop_condition
    turns:
      - { speaker: persona, text: "Hi, thanks for coming in. Tell us about a project you're proud of." }
      - { speaker: user, text: "I'm proudest of a campus bus-tracker I built, and about 800 students use it every week. It shows where each campus bus is and how many minutes until the next one." }
      - { speaker: persona, text: "Built it how? Who did what?" }
      - { speaker: user, text: "My teammate built the screens; I wrote the live-location backend, and the timezone bug was mine. It's a React Native app, and my Node server takes a location from each driver's phone every ten seconds." }
      - { speaker: persona, text: "What timezone bug?" }
      - { speaker: user, text: "After the clocks changed in October, buses showed in the wrong place for two days. I logged the raw timestamps and found my server was reading the phones' local times as UTC, so every update looked an hour old. I switched everything to UTC and added a test that runs across the clock change. Since the fix, it's had zero wrong-location reports in four months." }
      - { speaker: persona, name: Nora, text: "I love that students rely on it. How did you learn what they wanted?" }
      - { speaker: user, text: "I spent two mornings by the library bus shelter and asked 40 students what they needed. Most wanted minutes until the next bus, not a map, so I put a countdown on the home screen first." }
      - { speaker: persona, name: Ben, text: "So why us, and not a big company? And what would you ship in your first week?" }
      - { speaker: user, text: "Because Tray has the same problem I solved: telling a hungry student exactly when their order will be ready. In my first week I'd like to ship one small change end to end, like making the ready-time estimate update live, so I learn how you deploy." }
      - { speaker: persona, text: "And what would you do differently on the bus app now?" }
      - { speaker: user, text: "I'd store every time in UTC from day one. Now I test anything with times across a clock change before I ship it." }
      - { speaker: persona, text: "Thanks. That's a clear answer." }
    grade:
      dimensions:
        answer_directness:
          score: 4
          evidence_quotes:
            - "I'm proudest of a campus bus-tracker I built, and about 800 students use it every week."
            - "Because Tray has the same problem I solved"
          rationale: "Your first sentence named the project and who uses it, and your first words to Ben were your reason for choosing this team."
          better_line: "I'm proudest of the bus-tracker, and my part was the live-location backend."
        star_structure:
          score: 3
          evidence_quotes:
            - "I logged the raw timestamps and found my server was reading the phones' local times as UTC"
            - "Since the fix, it's had zero wrong-location reports in four months."
          rationale: "What went wrong, what you did and how it turned out were all there, but the bug only came up when Ravi asked, so the story arrived in pieces."
          better_line: "After the October clock change, buses showed in the wrong place, so I traced it to my timestamps, fixed it, and it's been right since."
        evidence:
          score: 4
          evidence_quotes:
            - "about 800 students use it every week"
            - "asked 40 students what they needed"
          rationale: "Every claim had a number behind it, from weekly users to the students you asked and four months without a wrong location."
          better_line: "Forty students by the library told me they wanted minutes, not a map."
        ownership:
          score: 4
          evidence_quotes:
            - "I wrote the live-location backend, and the timezone bug was mine."
            - "Now I test anything with times across a clock change before I ship it."
          rationale: "You said which part was yours, owned the bug without blaming anyone, and said what you now do differently."
          better_line: "The bug was in my code, and now every time I store is in UTC."
      key_line: "Since the fix, it's had zero wrong-location reports in four months."
      safety_flag: false
