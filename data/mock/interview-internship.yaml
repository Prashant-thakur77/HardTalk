      - { speaker: persona, name: Nora, text: "I like that students actually use it. How did you work out what they wanted?" }
      - { speaker: user, text: "We just figured it out as we went, and friends gave us feedback. A lot of people said they liked it." }
      - { speaker: persona, text: "How many people use it?" }
      - { speaker: user, text: "Quite a lot, I think. It's pretty popular on campus now." }
      - { speaker: persona, name: Ben, text: "Why intern with us and not a big company? And what would you ship in your first week?" }
      - { speaker: user, text: "I just want real experience, and startups are exciting. In my first week I'd probably learn the codebase and see where I can help." }
      - { speaker: persona, text: "Okay. Thanks." }
