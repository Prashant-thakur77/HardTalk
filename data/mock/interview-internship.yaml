# Recorded conversations replayed in mock mode. Attempt 1 is a typical first try;
# attempt 2 is the retry. Every evidence quote is a verbatim substring of a user turn.
scenario_id: interview-internship
attempts:
  - end_reason: stop_condition
    turns:
      - { speaker: persona, text: "Hi, thanks for coming in. Tell us about a project you're proud of." }
      - { speaker: user, text: "So, I've done a lot of projects, mostly for my courses. The one I like most is a bus app we made. It tracks the campus buses and people found it really useful." }
      - { speaker: persona, text: "What exactly did you build yourself?" }
