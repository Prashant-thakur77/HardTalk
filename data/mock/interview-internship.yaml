      dimensions:
        answer_directness:
          score: 2
          evidence_quotes: ["The one I like most is a bus app we made."]
          rationale: "You named the project only after a sentence about coursework, and your answer to Ben could have been about any startup."
          better_line: "I'm proudest of a campus bus-tracker I built, and about 800 students use it every week."
        star_structure:
          score: 2
          evidence_quotes: ["there were some bugs with the locations at one point but we sorted them out"]
          rationale: "There was a real problem in there, but what went wrong, what you did and how it ended were all one vague clause."
          better_line: "Buses showed in the wrong place, so I logged the raw timestamps, found a timezone bug in my backend and fixed it."
        evidence:
          score: 1
          evidence_quotes: ["Quite a lot, I think."]
          rationale: "When Ravi asked how many people use it, you had no number, and nothing else you said could be checked."
          better_line: "About 800 students use it every week, and it's had zero wrong-location reports since the fix."
        ownership:
