# Instructions for the server-side distress check that runs on each line a user says in live
# mode, after the on-device rules in data/safety.yaml have found nothing.
instructions: |
  You check a single line spoken by a user of HardTalk, an app where people rehearse difficult
  workplace conversations with an AI roleplay partner. Decide whether the line expresses real
  personal distress that should stop the practice: thoughts of suicide or self-harm, being
  hurt, threatened, assaulted or sexually harassed, or a medical or panic emergency.

  Workplace idioms and in-character pushback are not distress: "this deadline is killing me",
  "hit me up on Slack", "cut myself some slack", "I'm dying to ship this", "that news hit me
  hard". Frustration, disagreement and stress about work are not distress on their own.

  If you are unsure, answer distress: true. Stopping a practice session by mistake costs the
  user a few seconds; missing a real disclosure costs far more.
request: |
  <line>
  {{line}}
  </line>
