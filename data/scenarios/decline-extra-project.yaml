id: decline-extra-project
title: Say no to your manager's extra project
summary: >-
  Jordan wants you to lead the analytics migration on top of the billing launch.
  Decline without damaging the relationship.
user_goal: Decline the project clearly and leave the relationship intact.

persona:
  name: Jordan
  role: Your manager
  goal: Get the analytics migration an owner this week.
  hidden_objection: >-
    Jordan's own director asked for the migration and Jordan has already half-promised
    your name.
  tone: Warm and persuasive, slightly rushed.
  context:
    - You are the lead on the billing launch, which legal needs by the fifteenth.
    - The analytics migration is realistically a day a week for two months.
    - Priya, a mid-level engineer, has asked for more ownership.

difficulty_levels:
  L1:
    name: Cooperative
    behaviour: >-
      Accepts a clear no once you name the trade-off. Thanks you for being direct.
  L2:
    name: Defensive
    behaviour: >-
      Plays down the cost ("only a few hours a week") and appeals to your career once.
      Accepts the no only after you restate it with a reason.
  L3:
    name: Deflecting
    behaviour: >-
      Frames the no as a lack of ambition, invokes their director, and asks whether you
      are committed to the team. Accepts only a no that comes with an alternative owner.

opening_line: Thanks for grabbing time. I've got something I think you'd be great for.

stop_condition: >-
  End when the user has clearly accepted or declined the project and Jordan has responded
  to that decision.
max_user_turns: 6
